const W=2048,H=1443;
const img=new Image();img.src=TEMPLATE_DATA;
let generatedData=null;

const nameEl=document.getElementById("name"),kmEl=document.getElementById("km");
const gen=document.getElementById("generate"),dl=document.getElementById("download");
const status=document.getElementById("status"),previewWrap=document.getElementById("previewWrap"),preview=document.getElementById("preview");

function cleanName(s){return s.trim().replace(/\s+/g," ");}
function fit(ctx,text,maxWidth,start){
 let size=start;
 while(size>24){
   ctx.font='700 '+size+'px Georgia,serif';
   if(ctx.measureText(text).width<=maxWidth)break;
   size-=1;
 }
 return size;
}
function generateCertificate(){
 const name=cleanName(nameEl.value),km=kmEl.value;
 if(!name||!km){alert("Please enter the participant name and select the KM category.");return;}
 gen.disabled=true;gen.textContent="Generating...";
 if(!img.complete){
   img.onload=()=>actuallyGenerate(name,km);
   img.onerror=()=>{alert("Certificate template could not be loaded.");gen.disabled=false;gen.textContent="Generate Certificate";};
 }else actuallyGenerate(name,km);
}
function actuallyGenerate(name,km){
 const c=document.createElement("canvas");c.width=W;c.height=H;
 const ctx=c.getContext("2d");ctx.drawImage(img,0,0,W,H);

 // NAME: above the horizontal blank line, centered in the original name area.
 ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="#15152f";
 const ns=fit(ctx,name,760,42);
 ctx.font='700 '+ns+'px Georgia,serif';
 ctx.fillText(name,1035,650);

 // KM: centered inside the original blank before “KM category”.
 const ks=fit(ctx,km,105,38);
 ctx.font='700 '+ks+'px Georgia,serif';
 ctx.fillText(km,747,778);

 generatedData=c.toDataURL("image/jpeg",0.95);
 preview.src=generatedData;previewWrap.style.display="block";dl.style.display="block";status.style.display="block";
 gen.disabled=false;gen.textContent="Generate Certificate";
 window.scrollTo(0,document.body.scrollHeight);
}
function base64ToBytes(dataUrl){
 const raw=atob(dataUrl.split(",")[1]),out=new Uint8Array(raw.length);
 for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
 return out;
}
function jpegToPdf(dataUrl){
 const jpg=base64ToBytes(dataUrl),enc=new TextEncoder(),chunks=[];let pos=0;const offsets=[0];
 const addB=b=>{chunks.push(b);pos+=b.length},addT=s=>addB(enc.encode(s));
 const obj=(n,b)=>{offsets[n]=pos;addT(n+" 0 obj\n"+b+"\nendobj\n");};
 addT("%PDF-1.4\n%\xff\xff\xff\xff\n");
 obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
 obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
 obj(3,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+W+" "+H+"] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
 offsets[4]=pos;
 addT("4 0 obj\n<< /Type /XObject /Subtype /Image /Width "+W+" /Height "+H+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n");
 addB(jpg);addT("\nendstream\nendobj\n");
 const stream="q\n"+W+" 0 0 "+H+" 0 0 cm\n/Im0 Do\nQ\n";
 offsets[5]=pos;addT("5 0 obj\n<< /Length "+enc.encode(stream).length+" >>\nstream\n"+stream+"endstream\nendobj\n");
 const xref=pos;addT("xref\n0 6\n0000000000 65535 f \n");
 for(let i=1;i<=5;i++)addT(String(offsets[i]).padStart(10,"0")+" 00000 n \n");
 addT("trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF");
 const total=new Uint8Array(pos);let at=0;for(const ch of chunks){total.set(ch,at);at+=ch.length;}
 return new Blob([total],{type:"application/pdf"});
}
gen.addEventListener("click",generateCertificate);
dl.addEventListener("click",()=>{
 if(!generatedData)return;
 const url=URL.createObjectURL(jpegToPdf(generatedData)),a=document.createElement("a");
 a.href=url;a.download="JCI-Virudhunagara-Elite-Virudhai-Marathon-2026-Certificate.pdf";
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
});
nameEl.addEventListener("keydown",e=>{if(e.key==="Enter")kmEl.focus();});
</script>
